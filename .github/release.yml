# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Runtime compatibility
      labels: [runtime]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
